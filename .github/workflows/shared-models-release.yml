name: Shared Models - Release

on:
  push:
    branches: [ dev ]
    paths: [ 'shared-models/**' ]

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./shared-models
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH
    
    - name: Install dependencies
      run: uv pip install --system -e ".[dev]"
    
    # Quick validation
    - name: Run tests
      run: uv run pytest tests/ --cov=src --cov-report=xml
    
    - name: Check formatting
      run: |
        uv run black --check src/ tests/ scripts/
        uv run isort --check-only src/ tests/ scripts/
    
    # Build and publish
    - name: Build package
      run: uv build
    
    - name: Publish to Azure Artifacts
      env:
        AZURE_ARTIFACTS_TOKEN: ${{ secrets.AZURE_ARTIFACTS_TOKEN }}
      run: |
        if [ -z "$AZURE_ARTIFACTS_TOKEN" ]; then
          echo "Azure Artifacts token not provided. Set AZURE_ARTIFACTS_TOKEN secret."
          exit 1
        fi
        echo "Configuring Azure Artifacts credentials..."
        cat <<EOF > ~/.pypirc
        [distutils]
        index-servers =
          python_packages

        [python_packages]
        repository = https://pkgs.dev.azure.com/ppokrovskii/resume_match_pro_v2/_packaging/python_packages/pypi/upload/
        username = azdo
        password = ${AZURE_ARTIFACTS_TOKEN}
        EOF
        echo "Uploading to Azure Artifacts feed..."
        uv run twine upload --repository python_packages dist/*
        echo "✅ Published to Azure Artifacts"