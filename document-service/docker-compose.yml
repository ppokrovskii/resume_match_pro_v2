version: '3.8'

services:
  # PostgreSQL Database for local development
  postgres:
    image: postgres:16-alpine
    container_name: document-service-postgres
    environment:
      POSTGRES_DB: resumematch
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d resumematch"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - document-service-network

  # Azurite (Azure Storage Emulator) for local development
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: document-service-azurite
    ports:
      - "10000:10000"  # Blob service
      - "10001:10001"  # Queue service
      - "10002:10002"  # Table service
    volumes:
      - azurite_data:/data
    command: "azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --location /data --debug /data/debug.log"
    restart: unless-stopped
    networks:
      - document-service-network


volumes:
  postgres_data:
    driver: local
  azurite_data:
    driver: local

networks:
  document-service-network:
    driver: bridge
    name: document-service-network