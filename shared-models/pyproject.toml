[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "resume-match-shared-models"
version = "0.1.0"
description = "Auto-generated Pydantic models from microservice OpenAPI specs for Resume Match Pro"
authors = [
    {name = "Resume Match Pro Team", email = "dev@resumematch.com"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "pydantic>=2.5.0",
    "typing-extensions>=4.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "datamodel-code-generator[http]>=0.21.0",
    "requests>=2.31.0",
    "httpx>=0.25.0",
]

[project.urls]
Homepage = "https://github.com/resume-match-pro/shared-models"
Repository = "https://github.com/resume-match-pro/shared-models"
Issues = "https://github.com/resume-match-pro/shared-models/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/shared_models"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=src/shared_models",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-fail-under=80",
]
markers = [
    "asyncio: marks tests as async (deselect with '-m \"not asyncio\"')",
]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | src/shared_models/generated
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
skip_glob = ["src/shared_models/generated/**/*"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
exclude = [
    "src/shared_models/generated/.*",
]

[dependency-groups]
dev = [
    "black>=25.9.0",
    "isort>=6.1.0",
    "mypy>=1.18.2",
]

