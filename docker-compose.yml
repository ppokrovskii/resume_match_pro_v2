version: '3.8'

services:
  # PostgreSQL with pgvector (Supabase alternative for local dev)
  postgres:
    image: pgvector/pgvector:pg15
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=resumematch
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d resumematch"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO (S3-compatible storage for local file storage)
  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"   # API port
      - "9001:9001"   # Console port
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin123
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Simple message queue (Redis-based)
  redis-queue:
    image: redis:7-alpine
    container_name: redis-queue
    ports:
      - "6380:6379"
    volumes:
      - redis-queue-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Jaeger (for distributed tracing)
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger
    ports:
      - "16686:16686"  # Jaeger UI
      - "14268:14268"  # Jaeger collector
    environment:
      - COLLECTOR_OTLP_ENABLED=true

  # Supabase Local (for complete local development)
  supabase:
    image: supabase/postgres:15.1.0.147
    container_name: supabase-db
    ports:
      - "54322:5432"
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    volumes:
      - supabase-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Development Environment Setup
  dev-setup:
    image: python:3.11-slim
    container_name: dev-setup
    volumes:
      - .:/app
    working_dir: /app
    command: |
      sh -c "
        echo 'Setting up development environment...'
        pip install uv
        echo 'Development environment ready!'
        echo 'Services available:'
        echo '  - PostgreSQL (pgvector): localhost:5432'
        echo '  - MinIO (file storage): localhost:9000'
        echo '  - Redis (cache): localhost:6379'
        echo '  - Redis Queue: localhost:6380'
        echo '  - Jaeger UI: localhost:16686'
        tail -f /dev/null
      "
    depends_on:
      - postgres
      - minio
      - redis
      - redis-queue
      - jaeger

volumes:
  postgres-data:
  supabase-data:
  minio-data:
  redis-data:
  redis-queue-data:

networks:
  default:
    name: resumematch-network
